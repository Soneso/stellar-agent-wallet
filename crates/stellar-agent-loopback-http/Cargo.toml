[package]
name = "stellar-agent-loopback-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared tower/axum defence-in-depth middleware, paired loopback listeners and page presentation for the Stellar agent wallet's browser-facing HTTP listeners (Host allowlist, Origin allowlist, hardened security headers, IPv4 and IPv6 loopback pair, brand stylesheet and inline mark)."
readme = "README.md"
keywords = ["stellar", "http", "middleware", "tower", "axum"]
categories = ["web-programming::http-server", "network-programming"]

[lib]
name = "stellar_agent_loopback_http"

[dependencies]
# HTTP framework types (Request/Response/StatusCode/header) the middleware
# operates on, and `axum::serve`, which runs a router on both listeners of a
# loopback pair. `matched-path`: the route template
# `request_trace::route_label` records.
axum = { workspace = true, features = ["matched-path"] }

# The two loopback listeners of a pair (`net`), their shared shutdown signal
# (`sync`), and the task per listener (`rt`).
tokio = { workspace = true, features = ["net", "sync", "rt"] }

# Layer/Service traits the middleware implements.
tower = { workspace = true }

# JSON rejection bodies (`{"error": "..."}`).
serde_json = { workspace = true }

# Diagnostic log line on a loopback-named Host at the wrong port.
tracing = { workspace = true }

[dev-dependencies]
# oneshot() driver + Router test harness for the middleware unit tests;
# timeouts and raw socket requests for the loopback pair tests.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "io-util"] }

[lints]
workspace = true
