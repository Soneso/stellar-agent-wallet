name: Bug report
description: Report a defect in the CLI, the MCP server, or the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Report a security vulnerability through SECURITY.md, never in a public issue.
        Remove secret seeds, private keys, and keyring secrets from everything you paste.
  - type: textarea
    id: what-you-did
    attributes:
      label: What you did
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The output you got, with secrets removed.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: The output of `stellar-agent --version` or the commit you built from, and your operating system and target.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal sequence of commands or MCP tool calls that shows the bug.
    validations:
      required: true
