name: Install surface

# Checks the documented install commands, the secret-seed procedures, and the
# binstall metadata (.github/scripts/check-install-surface.py). Checks the gate
# tool versions of docs/maintainers/building.md, the other workflows, and the
# composite actions against each tool's reference workflow pin
# (.github/scripts/check-gate-tool-versions.sh). Checks the writing style of
# the Markdown files (.github/scripts/check-docs-style.py) and the syntax of
# every workflow (actionlint). Runs each check's self-test, the Python ones on
# 3.13 and 3.11. It has no paths filter, so every pull request runs it,
# including one that touches only Markdown.

on:
  pull_request:
  push:
    branches: [main]

# Supersede in-flight runs for the same ref so rapid pushes do not queue stale
# work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the checked-out source.
permissions:
  contents: read

jobs:
  install-surface:
    name: install surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 .github/scripts/check-install-surface.py
      - name: Self-test Python checks on Python 3.13
        run: |
          python3 .github/scripts/test-check-install-surface.py
          python3 .github/scripts/test-check-docs-style.py
      - run: python3 .github/scripts/check-docs-style.py
      - run: bash .github/scripts/check-gate-tool-versions.sh
      - run: bash .github/scripts/test-check-gate-tool-versions.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Self-test Python checks on Python 3.11
        run: |
          python3 .github/scripts/test-check-install-surface.py
          python3 .github/scripts/test-check-docs-style.py
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: shellcheck@0.11.0
      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Check workflows
        run: actionlint
