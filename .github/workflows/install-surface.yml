name: Install surface

# Checks the documented install commands, the secret-seed procedures, and the
# binstall metadata (.github/scripts/check-install-surface.py). Checks the gate
# tool versions of docs/maintainers/building.md, the other workflows, and the
# composite actions against each tool's reference workflow pin
# (.github/scripts/check-gate-tool-versions.sh). Checks the writing style of
# the Markdown files (.github/scripts/check-docs-style.py) and the syntax of
# every workflow (actionlint). Runs each check's self-test, the Python ones on
# 3.13 and 3.11. Runs the self-test of the contributor preflight
# (.github/scripts/test-preflight.sh) and shellchecks the preflight and its
# self-test. It has no paths filter, so every pull request runs it, including
# one that touches only Markdown.

on:
  pull_request:
  push:
    branches: [main]

# Pull request runs cancel their predecessor. Push, schedule, and dispatch
# runs each have their own group and never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job only reads the checked-out source.
permissions:
  contents: read

jobs:
  install-surface:
    name: install surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check the install surface
        run: python3 .github/scripts/check-install-surface.py
      - name: Self-test Python checks on Python 3.13
        run: |
          python3 .github/scripts/test-check-install-surface.py
          python3 .github/scripts/test-check-docs-style.py
      - name: Check the docs style
        run: python3 .github/scripts/check-docs-style.py
      - name: Check the gate tool versions
        run: bash .github/scripts/check-gate-tool-versions.sh
      - name: Self-test the gate tool version check
        run: bash .github/scripts/test-check-gate-tool-versions.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Self-test Python checks on Python 3.11
        run: |
          python3 .github/scripts/test-check-install-surface.py
          python3 .github/scripts/test-check-docs-style.py
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: shellcheck@0.11.0
      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Check workflows
        run: actionlint
      - name: Self-test the preflight
        run: |
          bash .github/scripts/test-preflight.sh
          bash .github/scripts/test-preflight.sh --mutations
      - name: Shellcheck the preflight
        run: shellcheck -s bash .github/scripts/preflight.sh .github/scripts/test-preflight.sh
