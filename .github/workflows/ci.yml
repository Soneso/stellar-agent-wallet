name: CI

# Every pull request to main or mainnet-write runs the offline gate suite,
# including docs changes. Pushes to those branches use the paths filter below.
# Skill changes run the archive checks.
# The suite covers format, lint, rustdoc, offline tests, dependencies, and licenses.
# Coverage runs in coverage.yml.
# Live testnet tests run in a separate workflow.

on:
  push:
    branches: [main, mainnet-write]
    # Documentation, the license, and the plugin manifest cannot change a gate
    # result, so pushes skip them.
    # Skill changes run CI because release-contracts verifies the archive.
    paths:
      - '**'
      - '!**/*.md'
      - '!LICENSE'
      - '!.claude-plugin/**'
      - 'skills/**'
  pull_request:
    branches: [main, mainnet-write]

# Supersede in-flight runs for the same ref so rapid pushes do not queue stale
# work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# These jobs only read the checked-out source; deny the token every other scope.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FEATURES_EXCEPT_MAINNET_WRITE: test-helpers,test-hooks,test-loopback,testnet-acceptance,testnet-integration,testnet-helpers,verifier-registry,wiremock-helpers,deploy-cli,operator-enroll-browser-acceptance

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      # stellar-ledger pulls hidapi, which links libudev on Linux for HID device
      # enumeration. The runner ships pkg-config but not the libudev headers.
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The explicit feature list compile-checks the code behind
      # the testnet-acceptance features, without executing any test. The
      # workspace lints declared in the root Cargo.toml deny warnings; -D
      # warnings turns any remaining warning into a failure.
      # --no-default-features keeps mainnet-write off; the binary packages
      # enable it by default.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --no-default-features --features "$FEATURES_EXCEPT_MAINNET_WRITE" -- -D warnings

  doc:
    name: rustdoc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # --no-default-features keeps mainnet-write off; the binary packages
      # enable it by default.
      - name: Build the rustdoc
        run: cargo doc --workspace --no-deps --no-default-features --features "$FEATURES_EXCEPT_MAINNET_WRITE"

  test:
    name: test (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Dropping test-profile debuginfo roughly halves target/ size and link time,
    # keeping the build closure within the runner's free disk.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The smart-account dependency closure (Arkworks, wasmi, soroban-env-host)
      # plus every compiled test binary is large; reclaim space the build does
      # not need.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Offline tier only. The enabled features expose the test-only helpers and
      # fixtures the integration suites depend on; none of them pulls the live
      # testnet client helpers. The testnet-acceptance / testnet-integration
      # features stay off and the heavy submit flows are #[ignore]d, so no test
      # reaches the network. The live tiers stay disabled.
      # --no-default-features keeps mainnet-write off; the binary packages
      # enable it by default.
      - name: Run the offline tests
        run: cargo test --workspace --no-default-features --features test-helpers,test-hooks,test-loopback,verifier-registry
      - name: Check the proof matrix
        run: python3 .github/scripts/check-proof-matrix.py --configuration feature-off --workspace
      # The Friendbot helper tests run against loopback listeners only; `testnet-helpers` compiles the live client without reaching the network.
      - name: Run the test-support Friendbot unit tests
        run: cargo test -p stellar-agent-test-support --no-default-features --features testnet-helpers --lib
      # Without test-helpers, the integration target also checks that the library excludes the revoked test fixture.
      - name: Test the vendored Wasm release configuration
        run: cargo test -p stellar-agent-smart-account --test vendored_wasm_release_cfg
      - name: Test the policy pin release configuration
        run: cargo test -p stellar-agent-core --doc policy::pin
      # stellar-agent-test-support is consumed with a different feature set by
      # each crate; every set must compile on its own.
      - name: Check each test-support feature set
        run: |
          cargo check -p stellar-agent-test-support --no-default-features
          for feature in test-helpers testnet-helpers verifier-registry wiremock-helpers; do
            cargo check -p stellar-agent-test-support --no-default-features --features "$feature"
          done

  feature-on-clippy:
    name: feature-on-clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      # stellar-ledger pulls hidapi, which links libudev on Linux for HID
      # device enumeration. The runner ships pkg-config but not the libudev
      # headers.
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The explicit feature list compile-checks the code behind
      # the testnet-acceptance features, without executing any test. The
      # workspace lints declared in the root Cargo.toml deny warnings; -D
      # warnings turns any remaining warning into a failure.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features "mainnet-write,$FEATURES_EXCEPT_MAINNET_WRITE" -- -D warnings

  feature-on-doc:
    name: feature-on-doc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the rustdoc
        run: cargo doc --workspace --no-deps --features "mainnet-write,$FEATURES_EXCEPT_MAINNET_WRITE"

  feature-on-test:
    name: feature-on-test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Dropping test-profile debuginfo roughly halves target/ size and link
    # time, keeping the build closure within the runner's free disk.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The smart-account dependency closure (Arkworks, wasmi,
      # soroban-env-host) plus every compiled test binary is large; reclaim
      # space the build does not need.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Offline tier only. The enabled features expose the test-only helpers
      # and fixtures the integration suites depend on; none of them pulls the
      # live testnet client helpers. The testnet-acceptance and
      # testnet-integration features stay off and the heavy submit flows are
      # ignored tests, so no test reaches the network. The live tiers stay
      # disabled.
      - name: Run the offline tests
        run: cargo test --workspace --features mainnet-write,test-helpers,test-hooks,test-loopback,verifier-registry
      - name: Check network feature forwarding in isolation
        run: cargo check -p stellar-agent-network --features mainnet-write
      - name: Check the proof matrix
        run: python3 .github/scripts/check-proof-matrix.py --configuration feature-on --workspace

  feature-discipline:
    name: feature-discipline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Fetch the locked graph
        run: cargo fetch --locked
      - name: Check feature discipline and assertions
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/feature-check"
          "$RUNNER_TEMP/feature-check/bin/pip" install --quiet --disable-pip-version-check \
            --require-hashes --only-binary :all: \
            -r .github/scripts/workflow-check-requirements.txt
          "$RUNNER_TEMP/feature-check/bin/python" .github/scripts/check-feature-discipline.py
          "$RUNNER_TEMP/feature-check/bin/python" .github/scripts/test-check-feature-discipline.py --mutations
          bash .github/scripts/test-check-binary-marker.sh
          bash .github/scripts/test-release-checks.sh
          "$RUNNER_TEMP/feature-check/bin/python" .github/scripts/test-check-provenance.py --mutations

  release-shape:
    name: release-shape
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      # The host recipe that preflight's release-shape row runs too: the
      # release build script for the host target, then the marker check of
      # both binaries.
      - name: Build and check the release binaries
        run: bash .github/scripts/release/check-host.sh

  inbox-js:
    name: inbox renderers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.5.0
      - name: Test the inbox renderers
        run: node --test crates/stellar-agent-approval-ui/src/web/app_shared.test.mjs crates/stellar-agent-webauthn-bridge/src/web/glue.test.mjs
      - name: Test the mainnet approval pages
        run: node --test crates/stellar-agent-approval-ui/src/web/mainnet-presence.test.mjs

  mpp-interop:
    name: mpp released-sdk interop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.5.0
      - name: Enable Corepack
        run: corepack enable
      - name: Run the MPP interop harness
        run: .github/scripts/test-mpp-interop.sh

  sdk-v17-interop:
    name: stellar-sdk v17 preimage interop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.5.0
      - name: Enable Corepack
        run: corepack enable
      - name: Run the stellar-sdk v17 interop harness
        run: .github/scripts/test-sdk-v17-interop.sh

  release-contracts:
    name: release contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test the publish tier check
        run: .github/scripts/test-publish-crates-check.sh
      - name: Check the publish tiers
        run: .github/scripts/publish-crates.sh --check
      - name: Check the skill archive
        run: .github/scripts/package-skill.sh --check
      - name: Check the signer-set baseline gate
        run: bash .github/scripts/check-no-direct-sasignersetbaselined-emit.sh
      - name: Self-test the signer-set baseline gate
        run: bash .github/scripts/test-check-no-direct-sasignersetbaselined-emit.sh
      - name: Self-test the ref-on-main check
        run: bash .github/scripts/test-check-ref-on-main.sh
      - name: Self-test the testnet acceptance driver
        run: bash .github/scripts/test-run-testnet-acceptance.sh
      - name: Self-test the crates.io existence check
        run: bash .github/scripts/test-check-crates-exist.sh
      - name: Self-test the publish verification
        run: bash .github/scripts/test-publish-crates-verify.sh
      - name: Self-test the crate checksum comparison
        run: python3 .github/scripts/test-compare-crate-sums.py
      - name: Self-test the coverage floor gate
        run: python3 .github/scripts/test-check-coverage.py
      - name: Self-test the proof matrix check
        run: python3 .github/scripts/test-check-proof-matrix.py
      - name: Self-test the unsigned archive validation
        run: python3 .github/scripts/test-validate-unsigned-archive.py
      # The runner image documents no PyYAML for its system Python, so the
      # structural workflow check runs from a virtual environment with a
      # hash-pinned PyYAML.
      - name: Check the workflow structure and the label sync
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/workflow-check"
          "$RUNNER_TEMP/workflow-check/bin/pip" install --quiet --disable-pip-version-check \
            --require-hashes --only-binary :all: \
            -r .github/scripts/workflow-check-requirements.txt
          "$RUNNER_TEMP/workflow-check/bin/python" .github/scripts/check-workflow-invariants.py
          "$RUNNER_TEMP/workflow-check/bin/python" .github/scripts/test-check-workflow-invariants.py
          "$RUNNER_TEMP/workflow-check/bin/python" .github/scripts/test-take-workflow.py
          "$RUNNER_TEMP/workflow-check/bin/python" .github/scripts/test-sync-labels.py
          "$RUNNER_TEMP/workflow-check/bin/python" .github/scripts/test-triage-workflow.py
          "$RUNNER_TEMP/workflow-check/bin/python" .github/scripts/test-welcome-workflow.py
          "$RUNNER_TEMP/workflow-check/bin/python" .github/scripts/test-welcome-workflow.py --mutations

  windows-storage:
    name: windows-storage
    runs-on: windows-2025
    timeout-minutes: 90
    # Targeted regression coverage for Windows-only local-storage bugs that
    # ubuntu-24.04 cannot catch:
    #
    # 1. Audit-log sidecar-lock design: `AuditWriter` locks a sidecar file
    #    (`<log>.lock`), never the log file itself. `LockFileEx`'s exclusive
    #    lock is enforced against I/O issued through any OTHER handle to the
    #    SAME file, including a second handle opened by the SAME process —
    #    unlike POSIX advisory locks, which never block a second handle's
    #    I/O. An exclusive lock on the log file itself would make every concurrent
    #    reader fail on Windows while a writer is alive; the sidecar design
    #    keeps the log file lock-free on every platform, so this job runs the
    #    full `audit_log` module, including the reader suite and rotation.
    # 2. Parent-directory-fsync fix: `PendingApprovalStore`/`ToolsetGrantStore`
    #    open the parent directory as a file to fsync it after an atomic
    #    rename (a POSIX durability idiom) — `std::fs::File::open` on a
    #    directory path requires `FILE_FLAG_BACKUP_SEMANTICS` on Windows,
    #    which the stable API does not set, and fails with
    #    `ERROR_ACCESS_DENIED`. Both stores now skip this step on non-Unix.
    # 3. MPP authorization state: NamedTempFile replacement, sidecar locking,
    #    authenticated-record validation, and repeated mutation must preserve
    #    the same behavior on Windows as on Unix.
    # 4. Smart-account wire-code suite and MCP rule-tool suite: the rule
    #    tools open the per-profile audit writer/reader through the same
    #    sidecar-lock design as (1), so they exercise the audit path
    #    end-to-end on Windows on top of the wire-code coverage.
    #
    # Bounded to the touched crates' unit tests (not the full workspace
    # matrix) to keep this job cheap. The smart-account closure builds
    # vendored OpenSSL from source (`openssl` with the `vendored` feature,
    # carried by stellar-agent-smart-account for what webauthn-rs-core
    # links), so this job provides the same native Perl the release
    # workflow's Windows target uses; everything else in these closures
    # builds with the runner image's MSVC and LLVM toolchains.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: windows-storage
          # Failing iterations must still seed the build cache, or every
          # retry recompiles the dependency tree cold on a slow runner.
          cache-on-failure: true
      # The vendored OpenSSL build runs OpenSSL's perl-based Configure, which
      # needs a Windows-native Perl with its full module set; the MSYS perl
      # that Git for Windows puts on PATH lacks it. openssl-src honors
      # OPENSSL_SRC_PERL, so point it at Strawberry Perl (preinstalled on the
      # runner image; installed on the spot if a future image drops it).
      - name: Provide a native Perl for the vendored OpenSSL build
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Strawberry\perl\bin\perl.exe')) {
            choco install strawberryperl --no-progress -y
          }
          if (-not (Test-Path 'C:\Strawberry\perl\bin\perl.exe')) {
            Write-Error 'Strawberry Perl unavailable'
            exit 1
          }
          Add-Content $env:GITHUB_ENV "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe"
      # Compilation is unbounded below the job ceiling (a compile progresses
      # or errors; only cold-cache runs need the headroom). Test EXECUTION is
      # where a Windows lock deadlock can hang, so every test step runs under
      # a 10-minute GNU timeout (Git Bash) — a hang costs minutes, not the
      # rest of the job budget.
      - name: Build test binaries (unbounded compile phase)
        shell: bash
        run: cargo test -p stellar-agent-core -p stellar-agent-mpp -p stellar-agent-smart-account -p stellar-agent-mcp -p stellar-agent-headless-keyring -p stellar-agent-windows-identity -p stellar-agent-network --no-default-features --lib --no-run
      - name: Headless keyring and Windows identity suites
        shell: bash
        run: "timeout 600 cargo test -p stellar-agent-headless-keyring -p stellar-agent-windows-identity --lib"
      - name: DPAPI protect failure regression
        shell: bash
        run: |
          set -o pipefail
          timeout 600 cargo test -p stellar-agent-network --lib keyring::tests::dpapi_protect_failure_reaches_wallet_error -- --exact 2>&1 | tee dpapi-regression.log
          grep -q 'test result: ok. 1 passed' dpapi-regression.log
      - name: Audit-log regression (stellar-agent-core)
        shell: bash
        run: "timeout 600 cargo test -p stellar-agent-core --lib audit_log::"
      - name: Approval + toolset-grant store persist regression (stellar-agent-core)
        shell: bash
        run: "timeout 600 cargo test -p stellar-agent-core --lib -- approval::store::tests::persist approval::toolset_grant::tests::persist"
      - name: MPP authorization-store regression
        shell: bash
        run: "timeout 600 cargo test -p stellar-agent-mpp --lib store::tests::"
      - name: Smart-account wire-code suite
        shell: bash
        run: "timeout 600 cargo test -p stellar-agent-smart-account --lib"
      - name: MCP rule-tool suite (audit path end-to-end)
        shell: bash
        run: "timeout 600 cargo test -p stellar-agent-mcp --no-default-features --lib -- tools::rules:: tools::rule_create::"
      # 5. MCP shutdown on Windows console events. Each test starts the
      #    native server binary in a pseudoconsole of its own. It sends a real
      #    Ctrl-Break or closes that pseudoconsole, then checks the exit drain. Both
      #    feature states build the binary and run the three tests: feature
      #    off with --no-default-features, feature on with the default set,
      #    which carries mainnet-write. The log check requires all three to
      #    run and pass. In each state a second run covers the pseudoconsole
      #    driver: one process test and three environment block tests.
      - name: MCP binary and console-event tests, feature off (unbounded compile phase)
        shell: bash
        run: |
          cargo build -p stellar-agent-mcp --bin stellar-agent-mcp --target x86_64-pc-windows-msvc --no-default-features
          cargo test -p stellar-agent-mcp --target x86_64-pc-windows-msvc --no-default-features --features test-helpers --test mcp --no-run
      - name: MCP console-event shutdown tests, feature off
        shell: bash
        run: |
          set -o pipefail
          timeout 600 cargo test -p stellar-agent-mcp --target x86_64-pc-windows-msvc --no-default-features --features test-helpers --test mcp -- halt_integration::windows_ 2>&1 | tee windows-console-events-off.log
          grep -q 'test result: ok. 3 passed' windows-console-events-off.log
          timeout 600 cargo test -p stellar-agent-mcp --target x86_64-pc-windows-msvc --no-default-features --features test-helpers --test mcp -- common::child_process::windows_tests:: common::child_process::pseudo_console::tests:: 2>&1 | tee windows-driver-off.log
          grep -q 'test result: ok. 4 passed' windows-driver-off.log
          test "$(grep -c '^test common::child_process::windows_tests::.* \.\.\. ok' windows-driver-off.log)" -eq 1
          test "$(grep -c '^test common::child_process::pseudo_console::tests::.* \.\.\. ok' windows-driver-off.log)" -eq 3
      - name: MCP binary and console-event tests, feature on (unbounded compile phase)
        shell: bash
        run: |
          cargo build -p stellar-agent-mcp --bin stellar-agent-mcp --target x86_64-pc-windows-msvc
          cargo test -p stellar-agent-mcp --target x86_64-pc-windows-msvc --features test-helpers --test mcp --no-run
      - name: MCP console-event shutdown tests, feature on
        shell: bash
        run: |
          set -o pipefail
          timeout 600 cargo test -p stellar-agent-mcp --target x86_64-pc-windows-msvc --features test-helpers --test mcp -- halt_integration::windows_ 2>&1 | tee windows-console-events-on.log
          grep -q 'test result: ok. 3 passed' windows-console-events-on.log
          timeout 600 cargo test -p stellar-agent-mcp --target x86_64-pc-windows-msvc --features test-helpers --test mcp -- common::child_process::windows_tests:: common::child_process::pseudo_console::tests:: 2>&1 | tee windows-driver-on.log
          grep -q 'test result: ok. 4 passed' windows-driver-on.log
          test "$(grep -c '^test common::child_process::windows_tests::.* \.\.\. ok' windows-driver-on.log)" -eq 1
          test "$(grep -c '^test common::child_process::pseudo_console::tests::.* \.\.\. ok' windows-driver-on.log)" -eq 3

  platform-keyring:
    name: platform-keyring
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Mainnet wallet processes store their keys in the platform keyring, so
    # this job runs one write, read, and delete through the store the
    # binaries register: the Secret Service of GNOME Keyring. dbus-run-session
    # gives the keyring daemon and the test one private session bus. The
    # keyring lives for this job only, so a random password unlocks it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Install gnome-keyring and dbus
        run: sudo apt-get install -y gnome-keyring dbus
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: platform-keyring
      - name: Build the platform keyring test
        run: cargo test -p stellar-agent-network --test keyring_platform --no-run
      # The round trip is an ignored test, so a run that executes no test
      # fails on the count check.
      - name: Run the platform keyring round trip
        run: |
          set -o pipefail
          dbus-run-session -- bash -c '
            openssl rand -hex 16 | gnome-keyring-daemon --components=secrets --daemonize --unlock >/dev/null
            cargo test -p stellar-agent-network --test keyring_platform -- --ignored --exact keyring_platform_roundtrip
          ' 2>&1 | tee keyring-platform.log
          grep -q 'test result: ok. 1 passed' keyring-platform.log

  deploy-scripts:
    name: deploy-scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # The wrappers read stat, ls, and pgrep output, whose forms differ
    # between macOS and Linux, so the harness runs on each host against its
    # real tools and stubs the other platform's.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: shellcheck@0.11.0
      - name: Shellcheck the deployment scripts
        if: runner.os == 'Linux'
        run: shellcheck -s bash scripts/deploy/bootstrap.sh scripts/deploy/mcp-launch scripts/deploy/cli-launch scripts/deploy/provision scripts/deploy/validate-macos.sh scripts/deploy/validate-linux.sh scripts/deploy/test-deploy.sh
      - name: Run the deployment harness
        run: bash scripts/deploy/test-deploy.sh

  machete:
    name: unused-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo machete shells out to cargo metadata, so declare the toolchain
      # explicitly rather than relying on the runner image default.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-machete@0.9.2
      - name: Check for unused dependencies
        run: cargo machete

  deny:
    name: licenses-advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo deny check resolves the dependency graph via cargo metadata, so
      # declare the toolchain explicitly rather than relying on the runner image
      # default.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.19.9
      # The advisories check fetches the RustSec advisory database over the
      # network at run time, so its result can change between runs of the same
      # commit when an upstream advisory is published. The license, ban, and
      # source checks are deterministic from the committed Cargo.lock and
      # deny.toml.
      - name: Check licenses and advisories
        run: cargo deny check
