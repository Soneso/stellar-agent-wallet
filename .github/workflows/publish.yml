name: Publish to crates.io

# Publishes all workspace crates to crates.io from a tagged release commit.
#
# Publishing is a separate, manually dispatched act, so pushing a tag never
# publishes by itself. Two jobs split the work:
# - verify holds no credential. It builds and packages every crate of the tag
#   with `cargo package --workspace` and records the archive checksums in
#   SHA256SUMS.
# - publish runs in the `crates-io` environment and compiles nothing. It
#   regenerates the archives with `--no-verify`, requires them to equal the
#   verify job's SHA256SUMS, and uploads each crate with
#   `cargo publish --no-verify`. It authenticates through crates.io Trusted
#   Publishing (GitHub OIDC, no long-lived registry token).
# Both jobs refuse a tag whose commit is not an ancestor of origin/main, and
# check out the tag by its full ref. They package the tag's tree in `src/` and
# run this workflow's scripts from the dispatched commit in `wf/`. Both
# install RELEASE_TOOLCHAIN, so both package with the same cargo.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0-alpha.10; must match the workspace version and point at a commit on main"
        required: true
        type: string
      verify_only:
        description: "Run only the verify job, which holds no credential"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The exact toolchain both jobs package with. The publish job refuses any
  # other cargo or rustc version.
  RELEASE_TOOLCHAIN: "1.99.0"

jobs:
  verify:
    name: verify (${{ inputs.tag }})
    runs-on: ubuntu-24.04
    # One cargo invocation verify-builds every workspace crate.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Validate the tag input
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$TAG" =~ $tag_re ]]; then
            echo "tag input does not match $tag_re" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The tag by its full ref, with every branch for the ancestry check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      # The commit of this workflow; its scripts check and package the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: wf
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}

      # RUSTUP_TOOLCHAIN overrides the tag's rust-toolchain.toml.
      - name: Pin the toolchain for every later step
        run: echo "RUSTUP_TOOLCHAIN=$RELEASE_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Refuse a modified checkout
        run: |
          set -euo pipefail
          for tree in src wf; do
            status=$(git -C "$tree" status --porcelain)
            if [ -n "$status" ]; then
              echo "$tree has local changes:" >&2
              printf '%s\n' "$status" >&2
              exit 1
            fi
          done

      - name: Refuse a tag whose commit is not on main
        working-directory: src
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/wf/.github/scripts/check-ref-on-main.sh" "$(git rev-parse HEAD)"

      - name: Verify every workspace member carries the tag's version
        working-directory: src
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/wf/.github/scripts/release-preflight-version-check.sh"

      # stellar-ledger pulls hidapi, which links libudev on Linux for HID device
      # enumeration. The runner ships pkg-config but not the libudev headers.
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      # Cargo packages every crate, then verify-builds each one against the
      # other workspace crates through its temporary local registry, so no
      # lower tier needs to be on crates.io yet.
      - name: Build and package every crate
        working-directory: src
        run: cargo package --workspace --locked

      - name: Record the archive checksums
        working-directory: src
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify-sums"
          (cd target/package && sha256sum -- *.crate > "$RUNNER_TEMP/verify-sums/SHA256SUMS")
          python3 "$GITHUB_WORKSPACE/wf/.github/scripts/compare-crate-sums.py" \
            "$RUNNER_TEMP/verify-sums/SHA256SUMS" target/package "$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-sums
          path: ${{ runner.temp }}/verify-sums/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

      # The verified archives, for diagnosis only. The publish job never
      # downloads them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-crates
          path: src/target/package/*.crate
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish (${{ inputs.tag }})
    needs: verify
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-24.04
    environment: crates-io
    # Uploads only, plus registry rate-limit and index waits.
    timeout-minutes: 300
    permissions:
      contents: read
      # Required for the crates.io Trusted Publishing OIDC token exchange.
      id-token: write
    steps:
      - name: Validate the tag input
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$TAG" =~ $tag_re ]]; then
            echo "tag input does not match $tag_re" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: wf
          persist-credentials: false

      # The one toolchain install in a credentialed job. It downloads the
      # pinned release with rustup and compiles nothing.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}

      - name: Pin the toolchain for every later step
        run: echo "RUSTUP_TOOLCHAIN=$RELEASE_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Refuse a tag whose commit is not on main
        working-directory: src
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/wf/.github/scripts/check-ref-on-main.sh" "$(git rev-parse HEAD)"

      - name: Verify every workspace member carries the tag's version
        working-directory: src
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/wf/.github/scripts/release-preflight-version-check.sh"

      # SHA256SUMS comes from a job that ran dependency build scripts. It is
      # read as data, outside the workspace, and only compared.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verify-sums
          path: ${{ runner.temp }}/verify

      # Both trees stay unmodified from the download to the token step:
      # checked before `cargo package` reads the tag's tree and again before
      # the token.
      - name: Refuse a modified checkout before packaging
        run: |
          set -euo pipefail
          for tree in src wf; do
            status=$(git -C "$tree" status --porcelain)
            if [ -n "$status" ]; then
              echo "$tree has local changes:" >&2
              printf '%s\n' "$status" >&2
              exit 1
            fi
          done

      - name: Regenerate the archives without building
        working-directory: src
        run: cargo package --workspace --locked --no-verify --target-dir "$RUNNER_TEMP/publish-target"

      - name: Require the archives to equal the verify job's checksums
        working-directory: src
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/wf/.github/scripts/compare-crate-sums.py" \
            "$RUNNER_TEMP/verify/SHA256SUMS" "$RUNNER_TEMP/publish-target/package" "$VERSION"

      - name: Refuse a modified checkout before the token
        run: |
          set -euo pipefail
          for tree in src wf; do
            status=$(git -C "$tree" status --porcelain)
            if [ -n "$status" ]; then
              echo "$tree has local changes:" >&2
              printf '%s\n' "$status" >&2
              exit 1
            fi
          done

      - name: Require the pinned toolchain
        working-directory: src
        run: |
          set -euo pipefail
          read -r _ cargo_release _ <<<"$(cargo -V)"
          read -r _ rustc_release _ <<<"$(rustc -V)"
          if [ "$cargo_release" != "$RELEASE_TOOLCHAIN" ] || [ "$rustc_release" != "$RELEASE_TOOLCHAIN" ]; then
            echo "toolchain mismatch: $cargo_release from cargo, $rustc_release from rustc, expected $RELEASE_TOOLCHAIN" >&2
            exit 1
          fi
          cargo -V
          rustc -V

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish all crates in dependency order
        working-directory: src
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/wf/.github/scripts/publish-crates.sh" --sums "$RUNNER_TEMP/verify/SHA256SUMS"
