name: Publish to crates.io

# Publishes the workspace crates to crates.io from a tagged release commit.
# The unpublished smart-account acceptance member is packaged with the others
# and never uploaded.
#
# Publishing is a separate, manually dispatched act, so pushing a tag never
# publishes by itself. Four jobs split the work:
# - verify holds no credential. It builds and packages every workspace member
#   of the tag, the unpublished one included, with `cargo package --workspace`,
#   checks each resulting binary's name, version, and mainnet-write marker,
#   and records the archive checksums in SHA256SUMS.
# - release-evidence proves the successful Release run of the tag and commit,
#   verifies its published signatures and provenance, and checks the tree.
#   It compiles nothing and holds only contents: read and actions: read.
# - publish runs in the `crates-io` environment and compiles nothing. It
#   regenerates the archives with `--no-verify`, requires them to equal the
#   verify job's SHA256SUMS, and uploads each crate with
#   `cargo publish --no-verify`. It authenticates through crates.io Trusted
#   Publishing (GitHub OIDC, no long-lived registry token).
# - verify-install holds no credential and runs only after publish. It
#   installs stellar-agent-cli of the tag's version from crates.io, derives
#   stellar-agent-mcp, and checks both names, versions, and markers.
# verify and publish refuse a tag whose commit is not an ancestor of
# origin/main. The verify, publish, and verify-install jobs check out the tag
# by its full ref in `src/` and run this workflow's scripts from the dispatched
# commit in `wf/`. These jobs install RELEASE_TOOLCHAIN, so verify and publish
# package with the same cargo, and verify-install builds with it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0-alpha.10; must match the workspace version and point at a commit on main"
        required: true
        type: string
      verify_only:
        description: "Run crate verification and Release evidence checks without publishing"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_MAINNET_WRITE: "on"
  # The exact toolchain both jobs package with. The publish job refuses any
  # other cargo or rustc version.
  RELEASE_TOOLCHAIN: "1.100.0"

jobs:
  verify:
    name: verify (${{ inputs.tag }})
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    # One cargo invocation verify-builds every workspace member.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Validate the tag input
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$TAG" =~ $tag_re ]]; then
            echo "tag input does not match $tag_re" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The tag by its full ref, with every branch for the ancestry check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      # The commit of this workflow; its scripts check and package the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: wf
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}

      # RUSTUP_TOOLCHAIN overrides the tag's rust-toolchain.toml.
      - name: Pin the toolchain for every later step
        run: echo "RUSTUP_TOOLCHAIN=$RELEASE_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Refuse a modified checkout
        run: |
          set -euo pipefail
          for tree in src wf; do
            status=$(git -C "$tree" status --porcelain)
            if [ -n "$status" ]; then
              echo "$tree has local changes:" >&2
              printf '%s\n' "$status" >&2
              exit 1
            fi
          done

      - name: Refuse a tag whose commit is not on main
        working-directory: src
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/wf/.github/scripts/check-ref-on-main.sh" "$(git rev-parse HEAD)"

      - name: Record the verified source commit
        id: source
        working-directory: src
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify every workspace member carries the tag's version
        working-directory: src
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/wf/.github/scripts/release-preflight-version-check.sh"

      # stellar-ledger pulls hidapi, which links libudev on Linux for HID device
      # enumeration. The runner ships pkg-config but not the libudev headers.
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libudev-dev pkg-config

      # Cargo packages every workspace member, then verify-builds each one
      # against the other members through its temporary local registry, so no
      # lower tier needs to be on crates.io yet.
      - name: Build and package every crate
        working-directory: src
        run: |
          mkdir -p target
          touch target/package-verification-start
          cargo package --workspace --locked

      - name: Verify packaged feature state
        working-directory: src
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: bash "$GITHUB_WORKSPACE/wf/.github/scripts/check-packaged-markers.sh" target target/package-verification-start "$EXPECTED_MAINNET_WRITE" "$VERSION"

      - name: Record the archive checksums
        working-directory: src
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify-sums"
          (cd target/package && sha256sum -- *.crate > "$RUNNER_TEMP/verify-sums/SHA256SUMS")
          python3 "$GITHUB_WORKSPACE/wf/.github/scripts/compare-crate-sums.py" \
            "$RUNNER_TEMP/verify-sums/SHA256SUMS" target/package "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-sums
          path: ${{ runner.temp }}/verify-sums/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

      # The verified archives, for diagnosis only. The publish job never
      # downloads them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-crates
          path: src/target/package/*.crate
          retention-days: 7
          if-no-files-found: error

  # The tagged commit defines the rebuild recipe. The Release head_sha,
  # provenance source commit, checkout, and verified tag commit must agree.
  release-evidence:
    name: release-evidence
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Require the verified checkout
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          echo "RELEASE_DIR=$RUNNER_TEMP/release-evidence" >> "$GITHUB_ENV"

      - name: Select the successful Release run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/check-run-evidence.py --mode release \
            --repository "$GITHUB_REPOSITORY" --sha "$SOURCE_SHA" --tag "$TAG" \
            --wait-minutes 0 --poll-seconds 0

      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIR"/{all-artifacts,release-combined,all-signatures,provenance}
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > "$RELEASE_DIR/release.json"
          [ "$(jq -r .isDraft "$RELEASE_DIR/release.json")" = false ]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RELEASE_DIR/release-combined"
          jq -e --rawfile sums "$RELEASE_DIR/release-combined/SHA256SUMS" --arg provenance "stellar-agent-${TAG#v}.intoto.jsonl" \
            '($sums | split("\n") | map(select(length > 0) | .[66:])) as $archives | .isDraft == false and ($archives | length) == 5 and ([.assets[].name] | sort) == (($archives + ["SHA256SUMS"] + (($archives + ["SHA256SUMS"]) | map(. + ".sigstore.json")) + [$provenance]) | sort)' "$RELEASE_DIR/release.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.xz' --pattern '*.zip' --dir "$RELEASE_DIR/all-artifacts"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sigstore.json' --dir "$RELEASE_DIR/all-signatures"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.intoto.jsonl' --dir "$RELEASE_DIR/provenance"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Verify release signatures
        run: |
          bash .github/scripts/release/verify-signatures.sh "$RELEASE_DIR" \
            "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG" \
            https://token.actions.githubusercontent.com "$SOURCE_SHA"

      - name: Verify provenance signatures and run binding
        env:
          RELEASE_RUN_ID: ${{ steps.release.outputs.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ steps.release.outputs.run_attempt }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          verifier="$RUNNER_TEMP/slsa-verifier"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.1/slsa-verifier-linux-amd64 --output "$verifier"
          echo "946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339  $verifier" | sha256sum --check --strict
          chmod +x "$verifier"
          provenance=("$RELEASE_DIR"/provenance/*.intoto.jsonl)
          [ "${#provenance[@]}" -eq 1 ]
          for archive in "$RELEASE_DIR"/all-artifacts/*; do \
            "$verifier" verify-artifact "$archive" --provenance-path "${provenance[0]}" \
              --source-uri "github.com/$GITHUB_REPOSITORY" --source-tag "$TAG" \
              --builder-id https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0; \
          done
          python3 .github/scripts/check-provenance.py "${provenance[0]}" "$RELEASE_DIR/release-combined/SHA256SUMS" \
            "$SOURCE_SHA" "$GITHUB_REPOSITORY" "refs/tags/$TAG" \
            --run-id "$RELEASE_RUN_ID" --run-attempt "$RELEASE_RUN_ATTEMPT"

      - name: Check the tagged Wasm tree offline
        run: bash .github/scripts/rebuild-vendored-wasm.sh --check-tree --repo-root "$GITHUB_WORKSPACE"

  publish:
    name: publish (${{ inputs.tag }})
    needs: [verify, release-evidence]
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-24.04
    environment: crates-io
    # Uploads only, plus registry rate-limit and index waits.
    timeout-minutes: 300
    permissions:
      contents: read
      # Required for the crates.io Trusted Publishing OIDC token exchange.
      id-token: write
    steps:
      - name: Validate the tag input
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$TAG" =~ $tag_re ]]; then
            echo "tag input does not match $tag_re" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: wf
          persist-credentials: false

      - name: Require the verified source commit
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git -C src rev-parse HEAD)" = "$VERIFIED_SHA" ]

      # The one toolchain install in a credentialed job. It downloads the
      # pinned release with rustup and compiles nothing.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}

      - name: Pin the toolchain for every later step
        run: echo "RUSTUP_TOOLCHAIN=$RELEASE_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Refuse a tag whose commit is not on main
        working-directory: src
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/wf/.github/scripts/check-ref-on-main.sh" "$(git rev-parse HEAD)"

      - name: Verify every workspace member carries the tag's version
        working-directory: src
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/wf/.github/scripts/release-preflight-version-check.sh"

      # SHA256SUMS comes from a job that ran dependency build scripts. It is
      # read as data, outside the workspace, and only compared.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify-sums
          path: ${{ runner.temp }}/verify

      # Both trees stay unmodified from the download to the token step:
      # checked before `cargo package` reads the tag's tree and again before
      # the token.
      - name: Refuse a modified checkout before packaging
        run: |
          set -euo pipefail
          for tree in src wf; do
            status=$(git -C "$tree" status --porcelain)
            if [ -n "$status" ]; then
              echo "$tree has local changes:" >&2
              printf '%s\n' "$status" >&2
              exit 1
            fi
          done

      - name: Regenerate the archives without building
        working-directory: src
        run: cargo package --workspace --locked --no-verify --target-dir "$RUNNER_TEMP/publish-target"

      - name: Require the archives to equal the verify job's checksums
        working-directory: src
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/wf/.github/scripts/compare-crate-sums.py" \
            "$RUNNER_TEMP/verify/SHA256SUMS" "$RUNNER_TEMP/publish-target/package" "$VERSION"

      - name: Refuse a modified checkout before the token
        run: |
          set -euo pipefail
          for tree in src wf; do
            status=$(git -C "$tree" status --porcelain)
            if [ -n "$status" ]; then
              echo "$tree has local changes:" >&2
              printf '%s\n' "$status" >&2
              exit 1
            fi
          done

      - name: Require the pinned toolchain
        working-directory: src
        run: |
          set -euo pipefail
          read -r _ cargo_release _ <<<"$(cargo -V)"
          read -r _ rustc_release _ <<<"$(rustc -V)"
          if [ "$cargo_release" != "$RELEASE_TOOLCHAIN" ] || [ "$rustc_release" != "$RELEASE_TOOLCHAIN" ]; then
            echo "toolchain mismatch: $cargo_release from cargo, $rustc_release from rustc, expected $RELEASE_TOOLCHAIN" >&2
            exit 1
          fi
          cargo -V
          rustc -V

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish all crates in dependency order
        working-directory: src
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/wf/.github/scripts/publish-crates.sh" --sums "$RUNNER_TEMP/verify/SHA256SUMS"

  verify-install:
    name: verify-install
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Validate the tag input
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$TAG" =~ $tag_re ]]; then
            echo "tag input does not match $tag_re" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: src
          persist-credentials: false

      # The commit of this workflow; its scripts install and check the
      # published binaries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: wf
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}

      - name: Pin the install toolchain
        run: echo "RUSTUP_TOOLCHAIN=$RELEASE_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Install libudev (Linux hidapi)
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libudev-dev pkg-config

      - name: Verify registry installs
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash "$GITHUB_WORKSPACE/wf/.github/scripts/release/verify-install.sh" "$TAG" "$EXPECTED_MAINNET_WRITE"
