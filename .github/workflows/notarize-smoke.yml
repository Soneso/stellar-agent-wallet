# Maintenance smoke test for the macOS Developer ID signing and notarization
# path of release.yml. A build job with no secrets builds one darwin target
# and hands the unsigned binaries to a signing job. The signing job runs the
# same checks and the same composite action as the release's sign-macos job,
# with the fixed version 0.0.0-smoke. It creates no release and uploads no
# signed archive. Run it from main after rotating the certificate or the App
# Store Connect API key, and before the first release that relies on either.
name: Notarization smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (aarch64-apple-darwin)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: aarch64-apple-darwin

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin --bin stellar-agent --bin stellar-agent-mcp

      - name: Pack unsigned binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned"
          COPYFILE_DISABLE=1 /usr/bin/tar --create --format ustar --no-xattrs --no-acls --no-fflags \
            --file "$RUNNER_TEMP/unsigned/unsigned-aarch64-apple-darwin.tar" \
            -C target/aarch64-apple-darwin/release stellar-agent stellar-agent-mcp

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-aarch64-apple-darwin
          path: ${{ runner.temp }}/unsigned/unsigned-aarch64-apple-darwin.tar
          retention-days: 7
          if-no-files-found: error

  sign:
    name: sign + notarize smoke (aarch64-apple-darwin)
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    # The release-signing environment holds the Apple signing and notarization
    # secrets and limits the refs that can use them.
    environment: release-signing
    permissions:
      contents: read
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tool paths
        run: /bin/bash .github/actions/macos-sign-notarize/check-tools.sh

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-aarch64-apple-darwin
          path: ${{ runner.temp }}/unsigned

      # The checkout stays unmodified from the download to the signing step:
      # checked before the workspace scripts read the tar and again before
      # signing.
      - name: Refuse a modified checkout before validation
        run: |
          status="$(/usr/bin/git status --porcelain)"
          if [ -n "$status" ]; then
            echo "the checkout has local changes:" >&2
            printf '%s\n' "$status" >&2
            exit 1
          fi

      - name: Validate the unsigned binaries
        run: |
          /bin/bash .github/actions/macos-sign-notarize/validate-input.sh \
            "$RUNNER_TEMP/unsigned/unsigned-aarch64-apple-darwin.tar" "$RUNNER_TEMP/signing-input" arm64

      - name: Refuse a modified checkout before signing
        run: |
          status="$(/usr/bin/git status --porcelain)"
          if [ -n "$status" ]; then
            echo "the checkout has local changes:" >&2
            printf '%s\n' "$status" >&2
            exit 1
          fi

      - name: Sign, notarize, and pack
        id: sign
        uses: ./.github/actions/macos-sign-notarize
        with:
          binary-dir: ${{ runner.temp }}/signing-input
          target: aarch64-apple-darwin
          version: 0.0.0-smoke
          developer-id-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          asc-api-key-p8-base64: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          asc-key-id: ${{ secrets.APPLE_ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.APPLE_ASC_ISSUER_ID }}

      # The packed archive must hold the release layout and executable
      # binaries, each signed by a Developer ID Application identity.
      - name: Confirm the archive
        env:
          ARCHIVE: ${{ steps.sign.outputs.archive }}
        run: |
          NAME=stellar-agent-0.0.0-smoke-aarch64-apple-darwin
          CHECK="$RUNNER_TEMP/smoke-check"
          /bin/mkdir "$CHECK"
          /usr/bin/tar -xf "$ARCHIVE" -C "$CHECK"
          listing="$(cd "$CHECK" && /usr/bin/find . -print | LC_ALL=C /usr/bin/sort)"
          expected="$(printf '%s\n' . "./$NAME" "./$NAME/LICENSE" "./$NAME/README.md" \
            "./$NAME/stellar-agent" "./$NAME/stellar-agent-mcp")"
          if [ "$listing" != "$expected" ]; then
            printf 'archive layout differs:\n%s\n' "$listing" >&2
            exit 1
          fi
          for bin in stellar-agent stellar-agent-mcp; do
            if [ ! -x "$CHECK/$NAME/$bin" ]; then
              echo "$bin is not executable in the archive" >&2
              exit 1
            fi
            /usr/bin/codesign --verify --strict --verbose=2 "$CHECK/$NAME/$bin"
            info="$(/usr/bin/codesign -dvv "$CHECK/$NAME/$bin" 2>&1)"
            if ! printf '%s\n' "$info" | /usr/bin/grep '^Authority=Developer ID Application: '; then
              echo "$bin is not signed by a Developer ID Application identity:" >&2
              printf '%s\n' "$info" >&2
              exit 1
            fi
            printf '%s\n' "$info" | /usr/bin/grep '^TeamIdentifier='
          done
