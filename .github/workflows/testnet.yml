name: Testnet acceptance

# The live on-chain leg: every testnet-acceptance / testnet-integration suite,
# serialized, against the public Stellar testnet (RPC + Friendbot, ephemeral
# Friendbot-funded keypairs — no secrets). This deliberately does NOT run per
# push: a full leg takes hours of live round-trips and hammering Friendbot on
# every commit would rate-limit itself into flakiness. It runs on manual
# dispatch (pre-release validation, or after changing any *_testnet_acceptance
# test) and on a weekly schedule (drift detection: testnet protocol upgrades,
# RPC behaviour changes, third-party contract redeployments).

on:
  workflow_dispatch:
    inputs:
      filter:
        description: >-
          Only run suites whose "<crate>/<test target>" contains this
          substring (empty runs the full leg)
        required: false
        default: ''
      keyring:
        description: Storage route for native-capable suites
        type: choice
        required: false
        default: headless
        options:
          - headless
          - platform
      mainnet_write:
        description: >-
          Run every suite against the build with mainnet-write on
        type: boolean
        required: false
        default: true
      full_run:
        description: Continue share 2 after a failed share 1
        type: boolean
        required: false
        default: false
  schedule:
    # Weekly, Monday 05:00 UTC.
    - cron: '0 5 * * 1'

# Never run two legs at once: they would compete for Friendbot funding and
# trip its rate limits. Queued rather than cancelled so a dispatched run is
# never silently dropped.
concurrency:
  group: testnet-acceptance
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  config:
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule' || (vars.TESTNET_SCHEDULE != 'off' && github.ref == 'refs/heads/main')
    outputs:
      feature_state: ${{ steps.mode.outputs.feature_state }}
    steps:
      - name: Select feature state
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          MAINNET_WRITE: ${{ inputs.mainnet_write }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            week=$(( ($(date -u +%s) - 345600) / 604800 ))
            if [ "$((week % 2))" -eq 0 ]; then state=on; else state=off; fi
          elif [ "$MAINNET_WRITE" = true ]; then
            state=on
          else
            state=off
          fi
          echo "feature_state=$state" >> "$GITHUB_OUTPUT"

  acceptance-1:
    needs: config
    name: testnet acceptance (share 1/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Setting the repository variable TESTNET_SCHEDULE to "off" disables the
    # weekly run without a commit; manual dispatch bypasses this switch.
    if: github.event_name != 'schedule' || (vars.TESTNET_SCHEDULE != 'off' && github.ref == 'refs/heads/main')
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify checked-out revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      # The smart-account dependency closure plus every compiled test binary is
      # large; reclaim space the build does not need.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.100.0"
      # stellar-ledger pulls hidapi, which links libudev on Linux for HID device
      # enumeration. The runner ships pkg-config but not the libudev headers.
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libudev-dev pkg-config
      # The WebAuthn suite launches a headless Chromium for the CDP
      # virtual-authenticator ceremony (with --no-sandbox, so no userns
      # provisioning is needed on the runner). Explicit major-version tag (not
      # "stable") so the binary is deterministic across runs. Re-pin trigger:
      # Chromium stable major-version bump. Current pin: Chrome 150 (stable as
      # of 2026-07-02).
      - name: Setup Chromium (WebAuthn suite)
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 150
      # The HTTPS browser suites trust a test authority that the driver
      # installs into private NSS databases with certutil; this installs the
      # tool, not a trust anchor.
      - name: Install certutil (browser test authority)
        run: sudo apt-get -o Acquire::Retries=3 install -y libnss3-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The testnet feature set builds a different dependency graph from
          # the offline jobs; keep it in its own cache.
          prefix-key: testnet
          shared-key: testnet-${{ needs.config.outputs.feature_state }}
      # Platform selection requires a functioning Secret Service. The private
      # D-Bus session keeps the store and all acceptance children on one bus.
      - name: Install gnome-keyring (Linux Secret Service for the CLI v1-policy suite)
        run: sudo apt-get -o Acquire::Retries=3 install -y gnome-keyring dbus
      # The MPP and SEP-43 released-SDK interop suites assert the frozen Node
      # version they were validated against; the runner image's default Node
      # drifts, so the workflow pins it explicitly.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.5.0"
      # Serialization, inter-suite pacing, one-retry-with-cooldown, the
      # zero-tests-executed guard, and the per-suite durations all live in the
      # driver script so the same entrypoint runs locally and in CI. A
      # scheduled run uses the Monday-based state from config.
      - name: Run testnet acceptance suites
        env:
          SHARE: 1/2
          STELLAR_AGENT_PAYMENT_EVIDENCE_DIR: ${{ github.workspace }}/target/tmp/payment-evidence
          FILTER: ${{ inputs.filter }}
          MAINNET_WRITE: ${{ needs.config.outputs.feature_state }}
          STELLAR_AGENT_TEST_KEYRING: ${{ inputs.keyring || 'headless' }}
          STELLAR_AGENT_TESTNET_SECONDARY_RPC_URL: ${{ vars.TESTNET_SECONDARY_RPC_URL }}
        run: |
          dbus-run-session -- bash -c '
            gnome-keyring-daemon --components=secrets --daemonize --unlock <<< "ci-headless-keyring-password"
            exec .github/scripts/run-testnet-acceptance.sh
          '

      - name: Validate payment evidence
        if: always()
        env:
          PAYMENT_FILTER: ${{ inputs.filter }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_FEATURE_STATE: ${{ needs.config.outputs.feature_state }}
        run: python3 .github/scripts/check-payment-evidence.py target/tmp/payment-evidence --execution live-testnet --share 1/2 --filter "$PAYMENT_FILTER" --expected-revision "$EXPECTED_REVISION" --expected-feature-state "$EXPECTED_FEATURE_STATE"
      - name: Retain payment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payment-evidence-share-1-mainnet-${{ needs.config.outputs.feature_state }}-attempt-${{ github.run_attempt }}
          path: |
            target/tmp/payment-evidence/*.jsonl
            target/tmp/testnet-attempts/
          if-no-files-found: warn

  acceptance-2:
    needs: [config, acceptance-1]
    name: testnet acceptance (share 2/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Setting the repository variable TESTNET_SCHEDULE to "off" disables the
    # weekly run without a commit; manual dispatch bypasses this switch.
    if: ${{ !cancelled() && needs.config.result == 'success' && (github.event_name != 'schedule' || (vars.TESTNET_SCHEDULE != 'off' && github.ref == 'refs/heads/main')) && (needs.acceptance-1.result == 'success' || (inputs.full_run && needs.acceptance-1.result == 'failure')) }}
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify checked-out revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      # The smart-account dependency closure plus every compiled test binary is
      # large; reclaim space the build does not need.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.100.0"
      # stellar-ledger pulls hidapi, which links libudev on Linux for HID device
      # enumeration. The runner ships pkg-config but not the libudev headers.
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libudev-dev pkg-config
      # The WebAuthn suite launches a headless Chromium for the CDP
      # virtual-authenticator ceremony (with --no-sandbox, so no userns
      # provisioning is needed on the runner). Explicit major-version tag (not
      # "stable") so the binary is deterministic across runs. Re-pin trigger:
      # Chromium stable major-version bump. Current pin: Chrome 150 (stable as
      # of 2026-07-02).
      - name: Setup Chromium (WebAuthn suite)
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 150
      # The HTTPS browser suites trust a test authority that the driver
      # installs into private NSS databases with certutil; this installs the
      # tool, not a trust anchor.
      - name: Install certutil (browser test authority)
        run: sudo apt-get -o Acquire::Retries=3 install -y libnss3-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The testnet feature set builds a different dependency graph from
          # the offline jobs; keep it in its own cache.
          prefix-key: testnet
          shared-key: testnet-${{ needs.config.outputs.feature_state }}
      # Platform selection requires a functioning Secret Service. The private
      # D-Bus session keeps the store and all acceptance children on one bus.
      - name: Install gnome-keyring (Linux Secret Service for the CLI v1-policy suite)
        run: sudo apt-get -o Acquire::Retries=3 install -y gnome-keyring dbus
      # The MPP and SEP-43 released-SDK interop suites assert the frozen Node
      # version they were validated against; the runner image's default Node
      # drifts, so the workflow pins it explicitly.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.5.0"
      # Serialization, inter-suite pacing, one-retry-with-cooldown, the
      # zero-tests-executed guard, and the per-suite durations all live in the
      # driver script so the same entrypoint runs locally and in CI. A
      # scheduled run uses the Monday-based state from config.
      - name: Run testnet acceptance suites
        env:
          SHARE: 2/2
          STELLAR_AGENT_PAYMENT_EVIDENCE_DIR: ${{ github.workspace }}/target/tmp/payment-evidence
          FILTER: ${{ inputs.filter }}
          MAINNET_WRITE: ${{ needs.config.outputs.feature_state }}
          STELLAR_AGENT_TEST_KEYRING: ${{ inputs.keyring || 'headless' }}
          STELLAR_AGENT_TESTNET_SECONDARY_RPC_URL: ${{ vars.TESTNET_SECONDARY_RPC_URL }}
        run: |
          dbus-run-session -- bash -c '
            gnome-keyring-daemon --components=secrets --daemonize --unlock <<< "ci-headless-keyring-password"
            exec .github/scripts/run-testnet-acceptance.sh
          '

      - name: Validate payment evidence
        if: always()
        env:
          PAYMENT_FILTER: ${{ inputs.filter }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_FEATURE_STATE: ${{ needs.config.outputs.feature_state }}
        run: python3 .github/scripts/check-payment-evidence.py target/tmp/payment-evidence --execution live-testnet --share 2/2 --filter "$PAYMENT_FILTER" --expected-revision "$EXPECTED_REVISION" --expected-feature-state "$EXPECTED_FEATURE_STATE"
      - name: Retain payment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payment-evidence-share-2-mainnet-${{ needs.config.outputs.feature_state }}-attempt-${{ github.run_attempt }}
          path: |
            target/tmp/payment-evidence/*.jsonl
            target/tmp/testnet-attempts/
          if-no-files-found: warn
