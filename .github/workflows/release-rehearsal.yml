name: Release rehearsal

# Rehearses the build legs of release.yml on a branch, by dispatch only:
#
#   gh workflow run release-rehearsal.yml --ref <branch>
#
# Each leg builds one release target on the runner the release uses, with the
# release's setup steps and its build command through the scripts under
# .github/scripts/release/. The version is the stellar-agent-cli version of
# the checkout, so the run needs no tag. Each leg packs the archive the
# release packs, unsigned on the macOS legs, and uploads it as the artifact
# rehearsal-<target> for 7 days. Nothing is signed, notarized, hashed,
# attested, or published.
#
# Each verify-packaged leg unpacks one archive on a runner of its target,
# the Intel macOS archive under Rosetta 2, and checks the mainnet-write
# marker of both binaries. The verify-crates job packages every workspace
# crate with RELEASE_TOOLCHAIN, the toolchain publish.yml packages with, and
# checks the markers of the binaries that cargo's package verification
# builds.
#
# The workflow holds no credential: every job's token reads the repository
# contents and nothing else, and no job uses an environment, a secret, or the
# workflow token. check-workflow-invariants.py enforces that. It also requires
# both build jobs to call the shared scripts and RELEASE_TOOLCHAIN to equal
# the value in publish.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The expected mainnet-write state is off.
  EXPECTED_MAINNET_WRITE: "off"
  # The toolchain publish.yml packages with.
  RELEASE_TOOLCHAIN: "1.99.0"

jobs:
  build:
    name: build ${{ matrix.target }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-26
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      # The release and rehearsal restore and save no cache. Both build cold
      # from the locked sources with the pinned toolchain.
      - name: Pin the build toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$RELEASE_TOOLCHAIN" >> "$GITHUB_ENV"

      # stellar-agent-network depends on stellar-ledger, which pulls hidapi;
      # hidapi links libudev on Linux for HID device enumeration. Only the
      # native x86_64 build compiles directly on this runner and needs the
      # host's libudev headers. The aarch64 leg builds inside the cross Docker
      # image, which carries its own cross-compiled libudev.
      - name: Install libudev (Linux hidapi)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install cross (for aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --version 0.2.5 --locked

      # The environment guard of build.sh runs python3, 3.11 or later for
      # tomllib, so each leg installs it instead of relying on the image.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Provide a native Perl for the vendored OpenSSL build (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: ./.github/scripts/release/windows-perl.ps1

      - name: Prefetch libsodium dist (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: bash .github/scripts/release/sodium.sh

      - name: Build binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/release/build.sh "$TARGET"

      - name: Read the workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -ej '.packages[] | select(.name == "stellar-agent-cli") | .version')
          version_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$VERSION" =~ $version_re ]]; then
            echo "workspace version '$VERSION' does not match $version_re" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Rehearsing version: $VERSION"

      # The packing script of the signing action, run on the unsigned
      # binaries: the archive has the layout of the signed release archive.
      - name: Pack the unsigned archive (macOS)
        id: pack-macos
        if: contains(matrix.target, 'apple-darwin')
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
          BINARY_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
        run: /bin/bash .github/actions/macos-sign-notarize/archive.sh

      - name: Prepare archive
        id: prepare
        if: ${{ !contains(matrix.target, 'apple-darwin') }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="target/${TARGET}/release"
          STAGING_DIR="stellar-agent-${VERSION}-${TARGET}"
          mkdir -p "$STAGING_DIR"

          cp README.md "$STAGING_DIR/"
          cp LICENSE "$STAGING_DIR/"

          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then
            cp "$RELEASE_DIR/stellar-agent.exe" "$STAGING_DIR/"
            cp "$RELEASE_DIR/stellar-agent-mcp.exe" "$STAGING_DIR/"
            ARCHIVE_NAME="${STAGING_DIR}.zip"
            7z a -tzip "$ARCHIVE_NAME" "$STAGING_DIR" >/dev/null
          else
            cp "$RELEASE_DIR/stellar-agent" "$STAGING_DIR/"
            cp "$RELEASE_DIR/stellar-agent-mcp" "$STAGING_DIR/"
            ARCHIVE_NAME="${STAGING_DIR}.tar.xz"
            tar --create --xz --file "$ARCHIVE_NAME" "$STAGING_DIR"
          fi

          echo "archive=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-${{ matrix.target }}
          path: ${{ steps.pack-macos.outputs.archive || steps.prepare.outputs.archive }}
          retention-days: 7
          if-no-files-found: error

  verify-packaged:
    name: verify-packaged ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-26
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      - name: Require Rosetta
        if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rehearsal-${{ matrix.target }}
          path: archives
      - name: Verify packaged binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash .github/scripts/release/verify-archive.sh archives "$VERSION" "$TARGET" "$EXPECTED_MAINNET_WRITE"

  verify-crates:
    name: verify packaged crates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}
      # RUSTUP_TOOLCHAIN overrides the checkout's rust-toolchain.toml.
      - name: Pin the toolchain for every later step
        run: echo "RUSTUP_TOOLCHAIN=$RELEASE_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Build and package every crate
        run: |
          mkdir -p target
          touch target/package-verification-start
          cargo package --workspace --locked
      - name: Verify packaged feature state
        run: bash .github/scripts/check-packaged-markers.sh target target/package-verification-start "$EXPECTED_MAINNET_WRITE"
