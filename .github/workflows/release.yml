name: Release

# Builds, signs, and publishes a tagged release: preflight checks, a
# five-target build matrix producing one archive per target (both binaries in
# each archive), macOS signing and notarization in a separate job, a combined
# SHA256SUMS, cosign keyless signatures, SLSA provenance, and a GitHub
# Release.
#
# The per-push CI workflow gates fmt, clippy, tests, and licenses/advisories
# on every commit that reaches main. The preflight refuses a tag whose commit
# is not an ancestor of origin/main, so a release builds only such a commit.
# It also checks that the tag matches the workspace version and runs the
# install-surface check. It runs cargo-deny again because the dependency graph
# and the advisory database can shift between the last CI run on main and the
# tag. A tag push runs the workflow file of the tagged commit, so these checks
# bind only tags whose commit carries them. The tag ruleset and environment
# rules in docs/maintainers/releasing.md bind the rest.
#
# No job that holds a signing credential, a write-scoped token, or an OIDC
# token compiles code or runs dependency code. Such a job keeps artifacts of
# other jobs under the runner's temp directory as data, and reads outputs of
# other jobs only through environment variables it validates. The provenance
# job is the exception. It calls a reusable workflow, which has no step to
# validate its inputs, and passes it the subjects that the hashes job computes
# and the version that the preflight validates.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    # The crates.io check paces one request per publishable member, up to 30 s
    # each, so a hanging crates.io needs more than 15 min with the other steps.
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full history: the ancestry check reads refs/remotes/origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          tag_re='^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$GITHUB_REF" =~ $tag_re ]]; then
            echo "tag ref does not match $tag_re" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Refuse a tag whose commit is not on main
        run: .github/scripts/check-ref-on-main.sh "$GITHUB_SHA"

      - name: Warn when a workspace member is missing on crates.io
        run: .github/scripts/check-crates-exist.sh --warn

      - name: Verify tag matches workspace version
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/release-preflight-version-check.sh

      - name: Verify workspace.package.repository invariance
        # The repository field drives the `{ repo }` template variable in
        # [package.metadata.binstall] on both binary crates. A mismatch would
        # redirect `cargo binstall` to fetch from the wrong GitHub repository.
        run: |
          set -euo pipefail
          EXPECTED="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          ACTUAL=$(cargo metadata --format-version 1 --no-deps --offline --frozen \
            | jq -er '.packages[] | select(.source == null) | (.repository // "<MISSING>")' \
            | sort -u)
          COUNT=$(printf '%s\n' "$ACTUAL" | wc -l | tr -d ' ')
          if [ "$COUNT" -ne 1 ]; then
            echo "Workspace members disagree on repository URL:"
            while IFS= read -r line; do
              echo "  - $line"
            done <<< "$ACTUAL"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "[workspace.package].repository mismatch."
            echo "  expected: $EXPECTED"
            echo "  actual:   $ACTUAL"
            exit 1
          fi

      - name: Verify CHANGELOG version header exists
        run: |
          set -euo pipefail
          if ! grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md missing version header for v$TAG_VERSION"
            exit 1
          fi
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the documented install surface
        run: python3 .github/scripts/check-install-surface.py

      - name: Check cargo-deny
        # Dependency-graph gate specific to a release cut: cargo-deny runs on
        # every push to main too, but the dependency graph (and the RustSec
        # advisory database) can shift between the last CI run and the tag.
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny@0.19.9
      - run: cargo deny check

      - name: Verify working tree matches tag
        run: |
          set -euo pipefail
          if ! git diff --quiet HEAD; then
            echo "Working tree has uncommitted changes against HEAD"
            exit 1
          fi
          UNTRACKED=$(git status --porcelain | grep -E '^\?\?' || true)
          if [ -n "$UNTRACKED" ]; then
            echo "Working tree has untracked files (release must build from a clean tagged commit):"
            echo "$UNTRACKED"
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-26
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # stellar-agent-network depends on stellar-ledger, which pulls hidapi;
      # hidapi links libudev on Linux for HID device enumeration. Only the
      # native x86_64 build compiles directly on this runner and needs the
      # host's libudev headers — the aarch64 leg below builds inside the
      # cross Docker image, which carries its own cross-compiled libudev.
      - name: Install libudev (Linux hidapi)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install cross (for aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --version 0.2.5 --locked

      # stellar-baselib links libsodium; on MSVC its build script fetches the
      # prebuilt archive from download.libsodium.org over plain HTTP with no
      # retry, which is flaky from Windows runners. Pre-fetching the same
      # archive over HTTPS with retries into SODIUM_DIST_DIR makes the build
      # script consume the local copy instead; it still verifies the
      # archive's minisign signature against its pinned upstream key, so
      # integrity does not rest on this download step.
      # The vendored OpenSSL build runs OpenSSL's perl-based Configure, which
      # needs a Windows-native Perl with its full module set; the MSYS perl
      # that Git for Windows puts on PATH lacks it. openssl-src honors
      # OPENSSL_SRC_PERL, so point it at Strawberry Perl (preinstalled on the
      # runner image; installed on the spot if a future image drops it).
      - name: Provide a native Perl for the vendored OpenSSL build (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Strawberry\perl\bin\perl.exe')) {
            choco install strawberryperl --no-progress -y
          }
          if (-not (Test-Path 'C:\Strawberry\perl\bin\perl.exe')) {
            Write-Error 'Strawberry Perl unavailable'
            exit 1
          }
          Add-Content $env:GITHUB_ENV "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe"

      - name: Prefetch libsodium dist (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="$RUNNER_TEMP/sodium-dist"
          mkdir -p "$DIST_DIR"
          BASE="https://download.libsodium.org/libsodium/releases"
          for f in libsodium-1.0.22-stable-msvc.zip libsodium-1.0.22-stable-msvc.zip.minisig \
                   LATEST.tar.gz LATEST.tar.gz.minisig; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --output "$DIST_DIR/$f" "$BASE/$f"
          done
          echo "SODIUM_DIST_DIR=$DIST_DIR" >> "$GITHUB_ENV"

      - name: Build binaries
        # The aarch64 leg's image pin and its libudev pre-build hook live in
        # Cross.toml.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --locked --target ${{ matrix.target }} --bin stellar-agent --bin stellar-agent-mcp
          else
            cargo build --release --locked --target ${{ matrix.target }} --bin stellar-agent --bin stellar-agent-mcp
          fi

      # The macOS legs hand both unsigned binaries to the sign-macos job in one
      # tar, which keeps the executable bit. That job validates the tar before
      # it signs anything.
      - name: Pack unsigned binaries (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned"
          COPYFILE_DISABLE=1 /usr/bin/tar --create --format ustar --no-xattrs --no-acls --no-fflags \
            --file "$RUNNER_TEMP/unsigned/unsigned-$TARGET.tar" \
            -C "target/$TARGET/release" stellar-agent stellar-agent-mcp

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: contains(matrix.target, 'apple-darwin')
        with:
          name: unsigned-${{ matrix.target }}
          path: ${{ runner.temp }}/unsigned/unsigned-${{ matrix.target }}.tar
          retention-days: 7
          if-no-files-found: error

      - name: Prepare archive
        id: prepare
        if: ${{ !contains(matrix.target, 'apple-darwin') }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="target/${TARGET}/release"
          STAGING_DIR="stellar-agent-${VERSION}-${TARGET}"
          mkdir -p "$STAGING_DIR"

          cp README.md "$STAGING_DIR/"
          cp LICENSE "$STAGING_DIR/"

          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then
            cp "$RELEASE_DIR/stellar-agent.exe" "$STAGING_DIR/"
            cp "$RELEASE_DIR/stellar-agent-mcp.exe" "$STAGING_DIR/"
            ARCHIVE_NAME="${STAGING_DIR}.zip"
            7z a -tzip "$ARCHIVE_NAME" "$STAGING_DIR" >/dev/null
          else
            cp "$RELEASE_DIR/stellar-agent" "$STAGING_DIR/"
            cp "$RELEASE_DIR/stellar-agent-mcp" "$STAGING_DIR/"
            ARCHIVE_NAME="${STAGING_DIR}.tar.xz"
            tar --create --xz --file "$ARCHIVE_NAME" "$STAGING_DIR"
          fi

          echo "archive=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !contains(matrix.target, 'apple-darwin') }}
        with:
          name: artifacts-${{ matrix.target }}
          path: ${{ steps.prepare.outputs.archive }}
          retention-days: 7
          if-no-files-found: error

  # Developer ID signing and notarization of the macOS binaries. This job
  # compiles nothing: it validates the unsigned tar from the build job,
  # signs, notarizes, and packs the archive with tools at absolute paths.
  sign-macos:
    name: sign ${{ matrix.target }}
    needs: [preflight, build]
    runs-on: macos-26
    timeout-minutes: 60
    # The release-signing environment holds the Apple signing and notarization
    # secrets and limits the refs that can use them.
    environment: release-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: arm64
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tool paths
        run: /bin/bash .github/actions/macos-sign-notarize/check-tools.sh

      - name: Validate the release version
        id: version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          version_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$VERSION" =~ $version_re ]]; then
            echo "release version does not match $version_re" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ matrix.target }}
          path: ${{ runner.temp }}/unsigned

      # The checkout stays unmodified from the download to the signing step:
      # checked before the workspace scripts read the tar and again before
      # signing.
      - name: Refuse a modified checkout before validation
        run: |
          status="$(/usr/bin/git status --porcelain)"
          if [ -n "$status" ]; then
            echo "the checkout has local changes:" >&2
            printf '%s\n' "$status" >&2
            exit 1
          fi

      - name: Validate the unsigned binaries
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          /bin/bash .github/actions/macos-sign-notarize/validate-input.sh \
            "$RUNNER_TEMP/unsigned/unsigned-$TARGET.tar" "$RUNNER_TEMP/signing-input" "$ARCH"

      - name: Refuse a modified checkout before signing
        run: |
          status="$(/usr/bin/git status --porcelain)"
          if [ -n "$status" ]; then
            echo "the checkout has local changes:" >&2
            printf '%s\n' "$status" >&2
            exit 1
          fi

      - name: Sign, notarize, and pack
        id: sign
        uses: ./.github/actions/macos-sign-notarize
        with:
          binary-dir: ${{ runner.temp }}/signing-input
          target: ${{ matrix.target }}
          version: ${{ steps.version.outputs.version }}
          developer-id-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          asc-api-key-p8-base64: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          asc-key-id: ${{ secrets.APPLE_ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.APPLE_ASC_ISSUER_ID }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-${{ matrix.target }}
          path: ${{ steps.sign.outputs.archive }}
          retention-days: 7
          if-no-files-found: error

  hashes:
    name: hashes
    needs: [preflight, build, sign-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      subjects: ${{ steps.subjects.outputs.subjects }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: all-artifacts

      - name: Compute SHA256SUMS and base64 subjects
        id: subjects
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          version_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$VERSION" =~ $version_re ]]; then
            echo "release version does not match $version_re" >&2
            exit 1
          fi

          # One archive per build-matrix target, and nothing else. Keep this
          # list equal to the build matrix.
          EXPECTED=$(
            for target in aarch64-apple-darwin aarch64-unknown-linux-gnu \
                          x86_64-apple-darwin x86_64-unknown-linux-gnu; do
              echo "stellar-agent-$VERSION-$target.tar.xz"
            done
            echo "stellar-agent-$VERSION-x86_64-pc-windows-msvc.zip"
          )
          ACTUAL=$(find all-artifacts -type f -printf '%f\n')
          if [ "$(printf '%s\n' "$EXPECTED" | LC_ALL=C sort)" != "$(printf '%s\n' "$ACTUAL" | LC_ALL=C sort)" ]; then
            echo "ERROR: the downloaded archives differ from one archive per build target"
            echo "expected:"
            printf '%s\n' "$EXPECTED" | sed 's/^/  /'
            echo "found:"
            printf '%s\n' "$ACTUAL" | sed 's/^/  /'
            exit 1
          fi

          mkdir -p release-combined
          : > release-combined/SHA256SUMS
          while IFS= read -r -d '' f; do
            ( cd "$(dirname "$f")" && sha256sum -- "$(basename "$f")" ) \
              >> release-combined/SHA256SUMS
          done < <(find all-artifacts \( -name '*.tar.xz' -o -name '*.zip' \) -print0 | LC_ALL=C sort -z)

          # SLSA generic generator subject format: base64-encoded
          # `sha256sum`-style output, one subject per line.
          SUBJECTS=$(base64 -w0 < release-combined/SHA256SUMS)
          echo "subjects=${SUBJECTS}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-hashes
          path: release-combined/SHA256SUMS
          retention-days: 7

  sign:
    name: sign
    needs: [preflight, build, hashes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: ${{ runner.temp }}/artifacts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-hashes
          path: ${{ runner.temp }}/release-combined

      - name: Sign archives and SHA256SUMS with cosign
        # `--bundle` writes signature, signing certificate, and the Rekor
        # transparency-log entry into one Sigstore bundle file. Verification
        # (see docs/verifying-releases.md) needs only the bundle plus the
        # certificate identity and OIDC issuer. It needs no separate
        # certificate file.
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP"/artifacts/artifacts-*/*.tar.xz "$RUNNER_TEMP"/artifacts/artifacts-*/*.zip "$RUNNER_TEMP"/release-combined/SHA256SUMS; do
            [ -f "$file" ] || continue
            echo "Signing $(basename "$file")"
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          path: |
            ${{ runner.temp }}/artifacts/**/*.sigstore.json
            ${{ runner.temp }}/release-combined/*.sigstore.json
          retention-days: 7

  provenance:
    name: provenance
    needs: [preflight, hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    # The SLSA generator MUST be referenced by a released semantic-version
    # tag (@vX.Y.Z), never a commit SHA: slsa-verifier resolves the trusted
    # builder identity from the ref recorded in the provenance, and a hash
    # pin fails that resolution. This is the one action reference in this
    # workflow that is intentionally not SHA-pinned.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.hashes.outputs.subjects }}
      upload-assets: false
      provenance-name: stellar-agent-${{ needs.preflight.outputs.version }}.intoto.jsonl

  publish:
    name: publish
    needs: [preflight, build, sign-macos, sign, hashes, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Validate the release version
        id: version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          version_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$VERSION" =~ $version_re ]]; then
            echo "release version does not match $version_re" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: ${{ runner.temp }}/release/all-artifacts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signatures
          path: ${{ runner.temp }}/release/all-signatures

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-hashes
          path: ${{ runner.temp }}/release/release-combined

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stellar-agent-${{ steps.version.outputs.version }}.intoto.jsonl
          path: ${{ runner.temp }}/release/release-provenance

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.txt"
          awk '
            /^## \['"$VERSION"'\]/ { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"

          # Standing preface on every release while versions are prereleases.
          if printf '%s' "$VERSION" | grep -q -- '-'; then
            { echo '> Alpha software - no warranty, use at your own risk. See LICENSE (Apache-2.0, sections 7-8) and SECURITY.md.'; echo; cat "$NOTES"; } > "$NOTES.tmp"
            mv "$NOTES.tmp" "$NOTES"
          fi

          if [ ! -s "$NOTES" ]; then
            echo "No release notes found for v$VERSION in CHANGELOG.md"
            exit 1
          fi

      # The release action uploads with its token input, which defaults to the
      # job's GITHUB_TOKEN; the checkout keeps no credential.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.txt
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          working_directory: ${{ runner.temp }}/release
          files: |
            all-artifacts/**/*.tar.xz
            all-artifacts/**/*.zip
            release-combined/SHA256SUMS
            all-signatures/**/*.sigstore.json
