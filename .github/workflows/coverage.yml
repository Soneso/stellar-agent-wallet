name: Coverage

# The coverage gate measures offline line coverage and enforces the per-crate
# floors of .github/scripts/check-coverage.py. It runs weekly on main, on a
# pull request that carries the `coverage` label, and on demand.
#
# The workflow has no paths filter: the required check `coverage` reports on
# every pull request, and the job condition decides whether a run measures.
# Branch protection accepts a coverage job skipped by its condition.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # Weekly, Monday 04:41 UTC.
    - cron: '41 4 * * 1'
  workflow_dispatch:

# Supersede in-flight runs for the same ref so rapid pushes and label changes
# do not queue stale work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the checked-out source; deny the token every other scope.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: coverage
    # A pull request run reads the complete label set from the event payload
    # and measures when that set contains `coverage`. A label change by a
    # person or with an app token starts a new run. A change made with the
    # workflow token starts none; the triage and stale workflows use that token.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'coverage')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The instrumented build plus every compiled test binary is large; reclaim
      # space the build does not need.
      - name: Free disk space
        # The instrumented workspace build plus the vendored OpenSSL source
        # build need more headroom than the plain test job.
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Coverage builds are instrumented and differ from the other jobs; keep
          # them in a separate cache so they do not evict the plain-build caches.
          prefix-key: coverage
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov@0.8.7
      # Offline tier only, matching the `test` job's feature set. --all-features
      # is deliberately avoided so no live RPC / Friendbot test runs; coverage of
      # the remaining live-network lines is out of scope for this offline gate.
      - name: Measure offline line coverage
        run: cargo llvm-cov --workspace --features test-helpers,test-hooks,test-loopback,verifier-registry --json --output-path cov.json
      - name: Enforce per-crate line-coverage floors
        run: python3 .github/scripts/check-coverage.py cov.json
