name: Coverage

# The coverage workflow measures offline line coverage and enforces the per-crate
# floors of .github/scripts/check-coverage.py. Measurement runs on pushes to
# next (except proven docs-only changes) and main, weekly on main, on every
# pull request into main and code pull request into next, and on demand.
# The `coverage` label also measures a docs-only pull request into next.
#
# Push runs seed the coverage caches that pull requests into those branches
# restore. Two parallel jobs measure feature-off and feature-on, and each
# uploads its report. The required check `coverage` enforces both floors on
# those reports when measurement is required. A failed, cancelled, or unexpectedly
# skipped measurement fails it.
#
# The workflow has no paths filter: the required check `coverage` reports on
# every eligible event. A job skipped by its if reports under its unevaluated
# name, so the required job runs and passes docs-only next changes without
# measuring, unless a pull request carries the coverage label.

on:
  pull_request:
    branches: [main, next]
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [next, main]
  schedule:
    # Weekly, Monday 04:41 UTC.
    - cron: '41 4 * * 1'
  workflow_dispatch:

# Eligible pull request runs cancel their predecessor. Ignored events, pushes,
# schedules, and dispatches each have their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && (github.event_name != 'pull_request' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'labeled' && github.event.label.name == 'coverage') || (github.event.action == 'edited' && github.event.changes.base != null)) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs only read the checked-out source; deny the token every other scope.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'labeled' && github.event.label.name == 'coverage') || (github.event.action == 'edited' && github.event.changes.base != null) }}
    name: changes${{ !(github.event_name != 'pull_request' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'labeled' && github.event.label.name == 'coverage') || (github.event.action == 'edited' && github.event.changes.base != null)) && ' (ignored event)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
        run: python3 .github/scripts/classify-docs-only.py >> "$GITHUB_OUTPUT"

  coverage-off:
    name: coverage (feature-off)${{ !(github.event_name != 'pull_request' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'labeled' && github.event.label.name == 'coverage') || (github.event.action == 'edited' && github.event.changes.base != null)) && ' (ignored event)' || '' }}
    needs: changes
    # Eligible pull requests measure main, code or uncertain diffs, and the
    # coverage label. Label additions evaluate only coverage; edits evaluate only
    # base changes. GITHUB_TOKEN label changes start no workflow.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'labeled' && github.event.label.name == 'coverage') || (github.event.action == 'edited' && github.event.changes.base != null)) && (github.event_name != 'pull_request' || github.base_ref == 'main' || !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') || contains(github.event.pull_request.labels.*.name, 'coverage')) && !(github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The instrumented build plus every compiled test binary is large; reclaim
      # space the build does not need.
      - name: Free disk space
        # The instrumented workspace build plus the vendored OpenSSL source
        # build need more headroom than the plain test job.
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.100.0"
          components: llvm-tools-preview
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Instrumented builds use their own keys and share the repository
          # cache quota. They save on push runs and restore on pull requests.
          prefix-key: coverage
          save-if: ${{ github.event_name == 'push' }}
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-llvm-cov@0.8.7
      # Offline tier only, matching the test jobs. Coverage of
      # the remaining live-network lines is out of scope for this offline gate.
      # --no-default-features keeps mainnet-write off; the binary packages
      # enable it by default.
      - name: Measure offline line coverage
        run: cargo llvm-cov --workspace --no-default-features --features test-helpers,test-hooks,test-loopback,verifier-registry --json --output-path cov-feature-off.json
      # The run attempt in the name binds the report to this attempt.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cov-feature-off-${{ github.run_attempt }}
          path: cov-feature-off.json
          if-no-files-found: error
          retention-days: 1

  coverage-on:
    name: coverage (feature-on)${{ !(github.event_name != 'pull_request' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'labeled' && github.event.label.name == 'coverage') || (github.event.action == 'edited' && github.event.changes.base != null)) && ' (ignored event)' || '' }}
    needs: changes
    # Eligible pull requests measure main, code or uncertain diffs, and the
    # coverage label. Label additions evaluate only coverage; edits evaluate only
    # base changes. GITHUB_TOKEN label changes start no workflow.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'labeled' && github.event.label.name == 'coverage') || (github.event.action == 'edited' && github.event.changes.base != null)) && (github.event_name != 'pull_request' || github.base_ref == 'main' || !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') || contains(github.event.pull_request.labels.*.name, 'coverage')) && !(github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The instrumented build plus every compiled test binary is large; reclaim
      # space the build does not need.
      - name: Free disk space
        # The instrumented workspace build plus the vendored OpenSSL source
        # build need more headroom than the plain test job.
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.100.0"
          components: llvm-tools-preview
      - name: Install libudev (Linux hidapi)
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Instrumented builds use their own keys and share the repository
          # cache quota. They save on push runs and restore on pull requests.
          prefix-key: coverage
          save-if: ${{ github.event_name == 'push' }}
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-llvm-cov@0.8.7
      # Offline tier only, matching the test jobs. The explicit feature list
      # enables mainnet-write.
      - name: Measure feature-on offline line coverage
        run: cargo llvm-cov --workspace --features mainnet-write,test-helpers,test-hooks,test-loopback,verifier-registry --json --output-path cov-feature-on.json
      # The run attempt in the name binds the report to this attempt.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cov-feature-on-${{ github.run_attempt }}
          path: cov-feature-on.json
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: coverage${{ !(github.event_name != 'pull_request' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'labeled' && github.event.label.name == 'coverage') || (github.event.action == 'edited' && github.event.changes.base != null)) && ' (ignored event)' || '' }}
    needs: [changes, coverage-off, coverage-on]
    # A job skipped by its if reports under its unevaluated name. Run on every
    # eligible event so coverage passes docs-only next changes without measuring,
    # unless a pull request carries the coverage label. Step 1 checks the results;
    # steps 2 and 8 reject cancellation before and after the measured floors.
    if: always() && (github.event_name != 'pull_request' || github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'labeled' && github.event.label.name == 'coverage') || (github.event.action == 'edited' && github.event.changes.base != null))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # PyYAML reads unquoted OFF and ON as booleans; the quotes keep them strings.
      - name: Check both measurements
        id: decision
        env:
          MEASURE: ${{ (github.event_name != 'pull_request' || github.base_ref == 'main' || !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') || contains(github.event.pull_request.labels.*.name, 'coverage')) && !(github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
          CHANGES: ${{ needs.changes.result }}
          "OFF": ${{ needs.coverage-off.result }}
          "ON": ${{ needs.coverage-on.result }}
        run: |
          test "$CHANGES" = success
          if [ "$MEASURE" = false ]; then
            test "$OFF" = skipped
            test "$ON" = skipped
            echo "The change is docs-only; nothing was measured."
            echo "measured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$MEASURE" = true
          echo "feature-off: $OFF, feature-on: $ON"
          test "$OFF" = success
          test "$ON" = success
          echo "measured=true" >> "$GITHUB_OUTPUT"
      - name: Reject a cancelled run before the floors
        if: cancelled()
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.decision.outputs.measured == 'true'
        with:
          persist-credentials: false
      # Each download reads the report of this run attempt only. When measurement
      # is required, a gate rerun alone or a rerun of one part finds no report of
      # its attempt and fails.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.decision.outputs.measured == 'true'
        with:
          name: cov-feature-off-${{ github.run_attempt }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.decision.outputs.measured == 'true'
        with:
          name: cov-feature-on-${{ github.run_attempt }}
      - name: Enforce per-crate line-coverage floors
        if: steps.decision.outputs.measured == 'true'
        run: python3 .github/scripts/check-coverage.py cov-feature-off.json --configuration feature-off
      - name: Enforce feature-on line-coverage floors
        if: steps.decision.outputs.measured == 'true'
        run: python3 .github/scripts/check-coverage.py cov-feature-on.json --configuration feature-on
      - name: Reject a cancelled run after the floors
        if: cancelled()
        run: exit 1
