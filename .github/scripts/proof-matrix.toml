# Delivery keys.

[[delivery]]
key = "operation-notification"
change = "operation-state notifications on MCP"

[[delivery]]
key = "x402-testnet-no-payer-view"
change = "on testnet and in a build without mainnet writes, the x402 tools pass no account view, so a minimum_reserve rule refuses with policy.engine_required before sizing; on mainnet the payer read sizes the call, and the claim's mainnet-write scope names its tests"

[[delivery]]
key = "testnet-floor-no-account-view"
change = "in a build without mainnet writes, the balance floor reads no account and refuses account.unread before any send (crates/stellar-agent-core/src/policy/v1/criteria/balance_floor.rs:97-98), so no floor input is stored to survive a restart, and a claim or trustline row runs no other input; on mainnet the floor reads the first call's retained obligation, and the claim's mainnet-write scope names its tests"

[[delivery]]
key = "cli-trustline-mainnet-reserve"
change = "the CLI trustline verb's refusal below the reserve of the trustline it opens has a test in the mainnet-write build only, which the claim's mainnet-write scope names; a test that runs in both builds follows"

[[delivery]]
key = "cli-mainnet-approval"
change = "a CLI value verb holds an approval only in a build with mainnet writes, so no test runs these rows in both builds; the claim's mainnet-write scope names their feature-on test"

