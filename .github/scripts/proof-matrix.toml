# The release proof matrix: for each claim the release proves and each value
# tool on MCP and the CLI, the tests that prove it or the change that
# delivers it. check-proof-matrix.py checks it against the test lists of
# both builds, and a change that renames a named test or delivers a pending
# claim updates it in the same pull request.
#
# The cell rule: a cell names a test only when the test asserts the claim
# for every row the cell lists. A test that iterates every tool counts for
# each row it reaches. Existing behavior without such a test for a row stays
# pending on "row-test". Rows that share a test set share one cell, and each
# (claim, row) pair a claim applies to has exactly one cell. A cell holds
# not_applicable only when its rows cannot exhibit the claim, and its reason
# says why that is safe.
#
# [[row]]: a value tool that mainnet admits; phase is prepare, commit or
# single on MCP and verb on the CLI. [[excluded]]: a value tool that refuses
# mainnet, with the tests of its refusal. [[claim]]: a claim, its family,
# the phases it applies to, and the builds that can exhibit it.
# [[delivery]]: the change a pending cell waits for. [[cell]]: the claim, its
# rows, and exactly one of tests, pending (a delivery key) or not_applicable
# (a reason).
#
# A claim's builds is both (the default), feature-off or feature-on, and a
# proven cell names a ref that runs in each build the claim applies to and
# no ref that runs in another.
#
# A ref names a package, a target (lib, bin:<name> or test:<name>), the
# test's path in that target's list, and the builds that hold it: both (the
# default), feature-off or feature-on.

