# toolset commit, prove the outcomes their tests reach. A classic call,
# the toolset commit included, writes one value_action_pending row and no
# other value row when the endpoint applies it, times it out, reports it
# FAILED or refuses its send, on testnet and, for an applied call of the
# MCP and CLI rows, on mainnet. An x402 call
# writes one x402_payment_authorized row when paid, or one
