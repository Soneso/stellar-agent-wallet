# Independent contract workspace with its own toolchain and lockfile.
# The built artifact lives under
# crates/stellar-agent-smart-account/vendor/multicall-router/v0.1.0/.
[workspace]
resolver = "2"

[package]
name = "multicall-router"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Authorized multicall router for Stellar smart accounts."

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "=29.0.0"

[dev-dependencies]
soroban-sdk = { version = "=29.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
