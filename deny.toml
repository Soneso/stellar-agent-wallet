# cargo-deny configuration.

[advisories]
# Fail on crates with an active security advisory or that have been yanked.
yanked = "deny"
# Advisories and yanked crates accepted on purpose, each with its rationale.
ignore = [
    # Unmaintained-class advisories (informational, not security
    # vulnerabilities) on deep transitive build-time proc-macro crates pulled by
    # the OpenZeppelin Stellar contract crates (stellar-accounts /
    # stellar-governance) through soroban-sdk -> soroban-env-host -> arkworks.
    # There is no fixed release and no way to drop them without abandoning the
    # on-chain ABI types the smart-account encoding is verified against.
    "RUSTSEC-2024-0436", # paste: unmaintained
    # Dependency path: stellar-baselib 0.6.0 -> libsodium-sys-stable 1.24.0 ->
    # zip 8.6.0, as a build dependency. Every libsodium-sys-stable release
    # through 1.24.3 requires zip ^8.6, while the fix for these advisories is in
    # zip 9. zip runs only in the libsodium-sys-stable build script on Windows
    # MSVC targets. There it extracts the prebuilt libsodium archive after the
    # script verifies its minisign signature against a fixed key, so the archive
    # is not attacker-controlled. zip is not linked into the binaries. Remove
    # these entries once a libsodium-sys-stable release accepts zip 9.
    "RUSTSEC-2026-0367", # zip: SUID and SGID bits preserved on extraction
    "RUSTSEC-2026-0368", # zip: symlink targets outside the extraction directory
    "RUSTSEC-2026-0369", # zip: permissions applied through extracted symlinks
    # webpki-root-certs 0.26.11 is a re-export shim over webpki-root-certs 1.x (1.0.10 drops the emSign root).
    # rustls-platform-verifier 0.5 pulls the shim on wasm32 targets only; jsonrpsee-http-client 0.26 requires that 0.5 line.
    # Remove the entry once jsonrpsee-http-client moves to rustls-platform-verifier 0.6 or newer.
    { id = "RUSTSEC-2026-0383", reason = "webpki-root-certs 0.26.11 is a shim over webpki-root-certs 1.0.10, which carries the fix; it stays until jsonrpsee-http-client moves to rustls-platform-verifier 0.6 or newer" },
]

[licenses]
# Only permissive licenses are accepted.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    # ISC: ring (TLS crypto provider via reqwest rustls-tls).
    "ISC",
    # CDLA-Permissive-2.0: Mozilla CA root bundle (webpki-roots) used by the
    # rustls-tls webpki-roots default; a permissive data licence for the cert set.
    "CDLA-Permissive-2.0",
    # BSD-2-Clause: arrayref (transitive via blake3); fully permissive.
    "BSD-2-Clause",
    # MPL-2.0: option-ext (transitive via directories); file-level weak copyleft
    # that applies only to its own sources, which we use unmodified.
    "MPL-2.0",
    # Apache-2.0 WITH LLVM-exception: wasmparser + wasm-encoder (transitives of
    # soroban-spec-tools). The LLVM exception adds a linking exception to the
    # standard Apache-2.0, making it more permissive, not less.
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.9

# `nacl` is LGPL-3.0-or-later. It is a wasm32-only transitive dependency of
# stellar-baselib and is never compiled into the native (macOS/Linux/Windows)
# binaries this project builds, so the copyleft terms do not reach the shipped
# artifacts. The allowance is scoped narrowly to this one crate rather than
# permitting LGPL workspace-wide.
[[licenses.exceptions]]
name = "nacl"
allow = ["LGPL-3.0-or-later"]

[bans]
# Surface, but do not fail on, multiple versions of the same crate.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
