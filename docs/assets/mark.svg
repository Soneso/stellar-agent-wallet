<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Stellar Agent Wallet mark">
    <style>
    /* One wink (with synced smirk) per 6.2s cycle; rest otherwise. Resting
       frame equals the static mark. */
    @keyframes saw-mark-wink {
      0%, 27.5%, 35.5%, 100% { transform: scaleY(1); }
      30%, 33% { transform: scaleY(0.08); }
    }
    .saw-mark-wink-eye {
      animation: saw-mark-wink 6.2s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes saw-mark-smirk {
      0%, 27.5%, 35.5%, 100% { transform: translateY(0) rotate(0deg); }
      30%, 33% { transform: translateY(-1.2px) rotate(-4deg); }
    }
    .saw-mark-smirk-mouth {
      animation: saw-mark-smirk 6.2s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @media (prefers-reduced-motion: reduce) {
      .saw-mark-wink-eye, .saw-mark-smirk-mouth { animation: none; }
    }
  </style>
  <!-- antenna -->
  <line x1="60" y1="14" x2="60" y2="30" stroke="#5b8cc9" stroke-width="7" stroke-linecap="round"/>
  <circle cx="60" cy="10" r="9" fill="#ffb35c"/>
  <!-- head -->
  <rect x="12" y="30" width="96" height="78" rx="24" fill="#ffffff" stroke="#5b8cc9" stroke-width="7"/>
  <circle cx="44" cy="64" r="9" fill="#2f5382"/>
  <circle class="saw-mark-wink-eye" cx="76" cy="64" r="9" fill="#2f5382"/>
  <path class="saw-mark-smirk-mouth" d="M40 84 Q60 100 80 84" fill="none" stroke="#2f5382" stroke-width="7" stroke-linecap="round"/>
</svg>
